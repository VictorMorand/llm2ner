[project]
name = "llm2ner"
version = "0.2.0"
authors = [
  { name="Victor Morand", email="morand@isir.upmc.fr" },
]
description = "Codebase for using and training ToMMer models : Token Matching Entity Recognition"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICENSE*"]

dependencies = [
    "circuitsvis>=1.43.3",
    "einops>=0.8.1",
    "experimaestro",
    "ipywidgets>=8.1.6",
    "matplotlib",
    "notebook",
    "anywidget>=0.9.18",
    "openpyxl>=3.1.5",
    "plotly>=6.0.1",
    "scikit-learn",
    "spacy",
    "tensorboard>=2.20.0",
    "transformer-lens>=2.15.0",
    "xpm-torch",
]

[project.urls]
Homepage = "https://github.com/VictorMorand/llm2ner"
Issues = "https://github.com/VictorMorand/llm2ner/issues"

[tool.uv]
package = true

[tool.uv.sources]
llm2ner = { workspace = true }
xpm-torch = { git = "https://github.com/experimaestro/xpm-torch.git" }

[tool.setuptools]
# ...
include-package-data = true

[tool.setuptools.package-data]
"llm2ner.models" = ["*.md"]

[tool.uv.workspace]
members = [
    ".",
]

[dependency-groups]
dev = [
    "docutils>=0.21.2",
    "llm2ner",
    "openai>=2.6.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.2",
    "rotary-embedding-torch>=0.8.9",
    "ruff>=0.15.7",
]
test = [
    "pytest>=8",
    {include-group = "docs"},
]
docs = [
    "experimaestro>=2.3",
    "sphinx>=6",
    "sphinx-codeautolink>=0.15",
    "sphinx-rtd-theme>=3",
    "sphobjinv>=2.3",
]
